name: GOLPE FRANCO NEXT - publicar versiones automáticamente
on:
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'golpe-franco/index.html'
      - '.github/workflows/golpe-franco-next-publicador.yml'

permissions:
  contents: write

concurrency:
  group: golpe-franco-next-publicador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Sincronizar versiones publicadas
        run: python3 scripts/sync_golpe_franco_releases.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Actualizar catálogo público
        run: |
          if ! git diff --quiet -- docs/golpe-franco/releases.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/golpe-franco/releases.json
            git commit -m 'GOLPE FRANCO NEXT: sincronizar versiones publicadas'
            git push origin HEAD:main
          fi
