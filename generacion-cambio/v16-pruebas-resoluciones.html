(async()=>{const out=document.getElementById('result'),results=[];const sizes=[[3840,2160],[1920,1080],[1366,768],[1024,768],[768,1024],[390,844],[844,390],[360,640]];
const delay=ms=>new Promise(r=>setTimeout(r,ms));const selectors=['.topbar','.playhud','#hint','#viewport','#graphicSettings','#interact','#worlds','#minimap','#dpad'];

const home=['.home','.profile','#worlds'].map(q=>({q,el:d.querySelector(q)})).filter(x=>visible(x.el,w));const homeOver=[];for(let i=0;i<home.length;i++)for(let j=i+1;j<home.length;j++)if(intersects(home[i].el.getBoundingClientRect(),home[j].el.getBoundingClientRect()))homeOver.push(home[i].q+' / '+home[j].q);

const els=selectors.map(q=>({q,el:d.querySelector(q)})).filter(x=>visible(x.el,w));const boxes=els.map(x=>({q:x.q,r:x.el.getBoundingClientRect()}));let overlaps=[];for(let i=0;i<boxes.length;i++)for(let j=i+1;j<boxes.length;j++)if(intersects(boxes[i].r,boxes[j].r))overlaps.push(boxes[i].q+' / '+boxes[j].q);const outside=boxes.filter(x=>x.r.left<-2||x.r.top<-2||x.r.right>width+2||x.r.bottom>height+2).map(x=>x.q);
const touch=width<=1024;const touchButtons=[...d.querySelectorAll('#dpad button')].filter(e=>visible(e,w));const dpadCount=touchButtons.length;
w.GC_Phase2.openArea('oceano');await delay(50);const cards=d.querySelectorAll('.r15-card').length;const c=d.querySelector('#gcP2Content');const overflow=c.scrollWidth>c.clientWidth+2;d.querySelector('[data-r-open="o1"]').click();await delay(50);const phases=d.querySelectorAll('[data-r-step]').length;w.GC_Phase2.close?.();
results.push({width,height,homeOver,overlaps,outside,touchButtons:dpadCount,expectedTouch:touch?6:0,expedientes:cards,fases:phases,panelHorizontalOverflow:overflow,scene:boxes.find(x=>x.q==='#viewport')?Math.round(boxes.find(x=>x.q==='#viewport').r.width)+'x'+Math.round(boxes.find(x=>x.q==='#viewport').r.height):'missing'});}catch(e){results.push({width,height,error:String(e)})}finally{f.remove();out.textContent=JSON.stringify(results,null,2)}}out.textContent='AUDITORÍA TERMINADA\n'+JSON.stringify(results,null,2);window.auditResults=results;})()
</script></html>
