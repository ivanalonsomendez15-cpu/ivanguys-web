 const {main,events,mission,css,favicon}=JSON.parse(raw);
 const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
 const ico=document.createElement('link');ico.rel='icon';ico.type='image/svg+xml';ico.href=URL.createObjectURL(new Blob([favicon],{type:'image/svg+xml'}));document.head.appendChild(ico);
 const moduleUrl=s=>URL.createObjectURL(new Blob([s],{type:'text/javascript'}));
 const eventsUrl=moduleUrl(events),missionUrl=moduleUrl(mission);
 const entry=main.replaceAll("from './events.js'", "from '"+eventsUrl+"'").replaceAll("from './NovemberMission.js'","from '"+missionUrl+"'");
 await import(moduleUrl(entry));
} catch(e) {
 console.error(e);document.getElementById('root').innerHTML='<p style="font-family:system-ui;text-align:center;padding:3rem">No se pudo iniciar NOCHEPOLAR. Actualiza tu navegador e inténtalo de nuevo.</p>';
}
</script></body></html>
