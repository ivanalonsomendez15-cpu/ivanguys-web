    for(let i=0;i<5;i++){$('ans'+i).oninput=e=>{s.ans[i]=e.target.value;save()};$('double'+i).onchange=e=>{s.double[i]=e.target.checked;save()}}
  }
  function assess(s,i){let a=s.ans[i].trim(),r=s.r;if(!a)return {p:0,t:'Sin respuesta'};if(r.type==='Cifras'){try{let n=C.calculate(a,r.rack),d=Math.abs(n-r.target);return {p:d===0?10:d<=5?7:d<=10?5:0,t:n+' · diferencia '+d}}catch(e){return {p:0,t:e.message}}}let w=C.norm(a);if(!/^[a-zñ]+$/.test(w)||w.length<3||!C.fits(w,r.rack))return {p:0,t:'Letras no disponibles o palabra demasiado corta'};if(!C.dict.has(w)&&!s.approve[i])return {p:0,t:'Fuera del banco escolar; requiere revisión docente',pending:true};return {p:w.length,t:w.length+' letras'}}
  const pts=(s,i,a)=>a.p*(s.double[i]?2:1)*(s.r.final?2:1);
  function review(){let s=data.session,r=s.r,steps=[];if(r.type==='Cifras')C.calculate(r.solution,r.rack,steps);let explanation=r.type==='Cifras'?'<div class="solutionsteps" aria-label="Solución paso a paso">'+steps.map((v,i)=>'<div><span>'+(i+1)+'</span><strong>'+esc(v)+'</strong></div>').join('')+'</div>':'<div class="wordtiles">'+[...r.solution.toUpperCase()].map(c=>'<b>'+esc(c)+'</b>').join('')+'</div>';shell('<div class="head"><div><div class="eyebrow">CORRECCIÓN · RONDA '+(s.index+1)+'</div><h2>'+r.type+'</h2></div>'+button('Editar respuestas','edit')+'</div>'+scores(s)+'<div class="cols"><section class="panel"><h3>Resultados de los equipos</h3>'+s.teams.map((n,i)=>{let a=assess(s,i);return '<div class="resultrow"><div><b>'+esc(n)+'</b><p>'+esc(s.ans[i]||'—')+' · '+esc(a.t)+'</p>'+(a.pending?button('Validar palabra (docente)','approve:'+i):'')+'</div><strong>+'+pts(s,i,a)+'</strong></div>'}).join('')+'</section><section class="panel solution"><div class="eyebrow">SOLUCIÓN DE REFERENCIA</div><h3>'+esc(r.solution.toUpperCase())+(r.type==='Cifras'?' = '+r.target:'')+'</h3>'+explanation+'<p>'+(r.type==='Cifras'?'Una operación posible. Otras soluciones válidas también puntúan.':'La palabra más larga del banco incluido ('+C.words.filter(w=>w.length<=9).length.toLocaleString('es-ES')+' palabras normalizadas). Otras posibles: '+esc(r.alts.slice(1).join(', ')||'—')+'. El banco no es exhaustivo.')+'</p><small>Se aplican los comodines y el doble de la gran final.</small></section></div><div class="actions">'+button(s.index+1===s.total?'Cerrar jornada y guardar en liga':'Registrar puntos y siguiente ronda','next','primary')+'</div>','game')}
  function next(){let s=data.session;if(s.phase!=='review')return;s.scores=s.scores.map((x,i)=>x+pts(s,i,assess(s,i)));s.used=s.used.map((x,i)=>x||s.double[i]);s.index++;if(s.index===s.total){s.phase='end';data.league.push({date:new Date().toLocaleDateString('es-ES'),teams:[...s.teams],scores:[...s.scores]})}else makeRound(s);render()}
  function finish(){let s=data.session,max=Math.max(...s.scores),w=s.teams.filter((_,i)=>s.scores[i]===max);shell('<div class="finish"><div class="eyebrow">GRAN FINAL · JORNADA COMPLETADA</div><h2>¡Enhorabuena, equipos!</h2><p class="lead">'+(w.length>1?'Empate: ':'Equipo ganador: ')+esc(w.join(' · '))+'</p>'+scores(s)+'<p>Los resultados se han guardado en la liga de este navegador.</p><div class="actions">'+button('Ver liga','league','primary')+button('Nueva jornada','setup')+'</div></div>')}
  function league(){let tally=new Map();data.league.forEach(g=>g.teams.forEach((n,i)=>{let k=C.norm(n),v=tally.get(k)||{n,p:0,j:0};v.p+=g.scores[i];v.j++;tally.set(k,v)}));let rows=[...tally.values()].sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));shell('<div class="head"><div><div class="eyebrow">TEMPORADA ESCOLAR</div><h2>Liga de Cifras y Letras</h2></div>'+badge(data.league.length+' jornadas')+'</div>'+(rows.length?'<table><thead><tr><th>Posición</th><th>Equipo</th><th>Jornadas</th><th>Puntos</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.n)+'</td><td>'+x.j+'</td><td>'+x.p+'</td></tr>').join('')+'</tbody></table>':'<div class="notice">Aún no hay jornadas finalizadas.</div>')+'<p>Usad el mismo navegador y los mismos nombres de equipo cada semana. La liga no se sincroniza entre dispositivos.</p><div class="actions">'+button('Exportar CSV','export')+button('Reiniciar liga','clear')+button('Volver','home','primary')+'</div>')}
  function rules(){shell('<div class="eyebrow">REGLAMENTO ADAPTADO</div><h2>Cómo jugar</h2><div class="cols"><div class="panel"><h3>Cifras</h3><p>Seis fichas y una cifra objetivo. Utiliza suma, resta, multiplicación y división. Cada ficha se usa como máximo una vez. Los resultados intermedios deben ser enteros positivos.</p><p>Exacto: 10 puntos. Diferencia de 1 a 5: 7; de 6 a 10: 5; más de 10: 0.</p><h3>Letras</h3><p>Forma una palabra española de al menos tres letras, sin nombres propios. Una letra = un punto. Tildes indiferentes; Ñ distinta de N. La persona docente puede comprobar y aceptar palabras ausentes del banco. Siempre hay nueve fichas, incluso en el nivel experto.</p></div><div class="panel"><h3>Organización de clase</h3><p>Cinco equipos. Durante el tiempo cada grupo anota su solución en papel; luego el docente registra las respuestas en la PDI.</p><p>Un comodín ×2 por equipo y una pista común por jornada. La gran final tiene una ronda de cada modalidad a doble puntuación.</p><p>La ronda de Letras ODS utiliza vocabulario de la Agenda 2030, sin cambiar las reglas. No se incluyen otros tipos de ejercicios.</p><p>La liga es local y exportable. No se solicitan datos personales. En la corrección de Cifras puedes seguir cada operación de la solución paso a paso.</p></div></div><div class="actions">'+button('Volver','home','primary')+'</div>')}
  function render(){save();if(page==='home')return home();if(page==='setup')return setup();if(page==='league')return league();if(page==='rules')return rules();let s=data.session;if(!s){page='home';return home()}if(s.phase==='end')return finish();if(s.phase==='review')return review();question()}
  function action(a){let s=data.session;if(['home','setup','league','rules'].includes(a)){pause();page=a;render();return}if(a==='full'){if(document.fullscreenElement){document.exitFullscreen?.()}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>alert('Utiliza F11 para activar pantalla completa.'))}else alert('Utiliza F11 para activar pantalla completa.');return}if(a==='resume'){page='play';render();return}if(a==='start'){start();return}if(a==='clear'){if(confirm('¿Borrar todas las jornadas de la liga?')){data.league=[];render()}return}if(a==='export'){let rows=[['Fecha','Equipo','Puntos'],...data.league.flatMap(g=>g.teams.map((n,i)=>[g.date,n,g.scores[i]]))];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),l=document.createElement('a');l.href=url;l.download='liga-cifras-letras.csv';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(!s)return;if(a==='entry'){pause();s.entryMode=true;render();return}if(a==='reveal'){s.reveal=!s.reveal;render();return}if(a==='backboard'){s.entryMode=false;render();return}if(a==='timer'){if(running){pause();render()}else if(s.remaining>0){running=true;deadline=Date.now()+s.remaining*1000;timer=setInterval(tick,150);render()}return}if(a==='hint'){if(s.hintUsed&&!s.hint){alert('Ya se ha utilizado la pista común de esta jornada.');return}if(!s.hint&&confirm('¿Usar la pista común?')){s.hintUsed=true;s.hint=true;render()}return}if(a==='correct'){pause();if(!s.ans.some(x=>x.trim())&&!confirm('No hay respuestas. ¿Corregir igualmente?')){render();return}s.phase='review';render();return}if(a==='edit'){if(!confirm('La solución ya se ha revelado. Edita solo para corregir un error de registro.'))return;s.phase='question';s.remaining=0;s.entryMode=true;s.approve=Array(5).fill(false);render();return}if(a.startsWith('approve:')){if(confirm('¿Has comprobado que es una palabra válida en español, no un nombre propio?')){s.approve[+a.split(':')[1]]=true;render()}return}if(a==='next')next()}
  window.addEventListener('beforeunload',pause);render();
})();</script></body></html>
