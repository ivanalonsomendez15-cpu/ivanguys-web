<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misión Violeta · 25N · CP Carmen Ruiz-Tilve</title>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#322148;background:#201332}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #f6ca60;outline-offset:2px}
#app{height:100dvh;display:flex;flex-direction:column;gap:1.2vh;padding:1.5vh 2vw;background:radial-gradient(ellipse at 0 0,#5a318a,transparent 52%),radial-gradient(ellipse at 100% 100%,#653c74,transparent 53%),#211335}
header{height:8vh;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-weight:900}
.brand{display:flex;gap:12px;align-items:center;font-size:clamp(15px,1.7vw,24px)}.brand .star{background:#ffffff33;border-radius:11px;padding:8px 11px;font-size:26px}
.brand small{display:block;color:#e5d5ed;font-size:clamp(10px,.95vw,13px);font-weight:500}
.nav{display:flex;gap:8px}.nav button{color:#fff;background:#ffffff27;border:1px solid #ffffff77;padding:8px 13px;border-radius:11px;font-size:clamp(12px,1.1vw,17px);font-weight:800}
main{flex:1;min-height:0;background:#fffcff;border-radius:23px;overflow:hidden;box-shadow:0 16px 32px #1a0b2770;padding:clamp(16px,3vh,31px) clamp(16px,3vw,42px);display:flex;flex-direction:column;gap:1.5vh}
footer{text-align:center;color:#e8ddef;font-size:clamp(9px,.8vw,12px);height:2vh}
.tag{font-size:clamp(11px,1vw,14px);font-weight:950;color:#70439a;text-transform:uppercase;letter-spacing:.07em}
h1,h2,h3,p{margin:0}h1{font-size:clamp(38px,5.3vw,80px);color:#51307e;line-height:1;letter-spacing:-.045em}
h2{font-size:clamp(24px,3.2vw,45px);color:#503180;line-height:1.1;letter-spacing:-.035em}
h3{font-size:clamp(18px,1.6vw,25px);color:#4d2f7c}
.lead{font-size:clamp(16px,1.65vw,25px);line-height:1.47}
.btn{padding:11px 20px;border-radius:14px;font-weight:850;border:0;background:linear-gradient(105deg,#6b38aa,#a452bd);color:#fff;box-shadow:0 4px #502875}
.btn.sub{background:#f0e8f7;border:1px solid #d9c7e9;box-shadow:none;color:#563583}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.home{display:grid;grid-template-columns:.95fr 1.05fr;align-items:center;gap:3vw;height:100%}
.homecopy{display:flex;flex-direction:column;align-items:flex-start;gap:2.3vh}
.hero{position:relative;height:100%;min-height:0;display:grid;place-items:center;background:linear-gradient(135deg,#f4d9f8,#bee9e6);border-radius:19px;overflow:hidden}
.hero:before{content:"";position:absolute;width:65%;aspect-ratio:1;background:#ffffffaa;border-radius:50%}
.ribbon{font-size:clamp(105px,17vw,240px);position:relative;filter:drop-shadow(0 12px 12px #68558266)}
.float{position:absolute;background:#fff;padding:12px 18px;border-radius:17px;box-shadow:0 12px 22px #40314a38;color:#633984;font-weight:850}
.float.a{left:5%;top:13%}.float.b{right:5%;top:35%}.float.c{left:10%;bottom:17%}
.head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.score{background:#fff2ca;border-radius:11px;padding:9px 14px;font-weight:850;color:#795b2c;white-space:nowrap}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}
.mission{border:1px solid #dfd0eb;background:linear-gradient(145deg,#f3ebfb,#fff3f9);border-radius:17px;text-align:left;padding:15px;display:flex;flex-direction:column;gap:7px;min-height:0;color:#573784}
.mission:hover{border-color:#955bc3}.mission .icon{font-size:clamp(29px,4vw,58px)}.mission b{font-size:clamp(14px,1.3vw,21px);line-height:1.14}
.mission small{font-size:clamp(10px,1vw,14px);color:#655874}
.mission em{font-style:normal;font-weight:950;font-size:11px;color:#258566;margin-top:auto}
.stagebody{flex:1;display:grid;grid-template-columns:.38fr .62fr;gap:17px;min-height:0}
.illustration{background:linear-gradient(140deg,#d9b6ee,#c4e5e9);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.illustration span{font-size:clamp(70px,12vw,170px);filter:drop-shadow(0 14px 9px #5f4d7d44)}
.illustration b{color:#4b2b7c;font-size:clamp(15px,1.4vw,20px);text-align:center}
.question{display:flex;flex-direction:column;gap:9px;min-height:0}
.question h3{font-size:clamp(16px,1.47vw,23px);line-height:1.36}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:13px;background:#fff;border:2px solid #dfd3e9;border-radius:13px;padding:10px 12px;text-align:left;font-size:clamp(13px,1.13vw,18px);font-weight:680;color:#322744}
.option span{display:grid;place-items:center;min-width:30px;height:30px;border-radius:9px;color:#674098;background:#f0e5fa;font-weight:900}
.option.chosen{background:#f4eaff;border-color:#8956b8}
.option.correct{background:#e8f7ef;border-color:#55ad90}
.feedback{background:#e8f8f0;border:1px solid #9ed5c0;border-radius:13px;padding:12px 14px;font-size:clamp(13px,1.1vw,18px);line-height:1.42}
.feedback.wrong{background:#fff4e6;border-color:#eed4ad}
.bottom{margin-top:auto;display:flex;gap:10px;justify-content:flex-end}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:13px;flex:1}
.guide>div,.commitment{background:#f3ecfa;border:1px solid #e0d1ed;border-radius:15px;padding:18px;line-height:1.5}
.guide p{margin-top:7px}
.finish{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.finish .medal{font-size:clamp(56px,7vw,105px)}.finish h2{font-size:clamp(26px,3.6vw,52px)}
.commitment{max-width:850px}
@media(max-width:800px){#app{min-height:100dvh;height:auto}main{overflow:visible}.home{grid-template-columns:1fr}.hero{display:none}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.stagebody{grid-template-columns:1fr}.illustration{min-height:160px}.illustration span{font-size:75px}.guide{grid-template-columns:1fr}footer{height:auto}header{height:auto;flex-wrap:wrap}}
@media(max-height:740px) and (min-width:801px){main{padding:11px 20px;gap:7px}.option{padding:6px 9px}.question{gap:6px}.question h3{font-size:16px}.illustration span{font-size:90px}.grid{gap:8px}.mission{padding:10px}.mission .icon{font-size:30px}.mission b{font-size:15px}.btn{padding:8px 14px}}
</style>
</head>
<body>
<div id="app"><header><div class="brand"><span class="star">✦</span><div>MISIÓN VIOLETA · 25N<small>6.º de Primaria · CP Carmen Ruiz-Tilve · Oviedo</small></div></div><nav class="nav"><button id="map">Misiones</button><button id="restart">Reiniciar</button></nav></header><main id="screen"></main><footer>25 de noviembre · Día Internacional de la Eliminación de la Violencia contra la Mujer · ODS 5</footer></div>
<script>
const data=[
['🗓️','El misterio del 25N','La historia de esta fecha','¿Por qué se conmemora el 25 de noviembre?',['Es el día de las fiestas del colegio.','Recuerda a las hermanas Mirabal y rechaza la violencia contra las mujeres.','Es un día dedicado exclusivamente al deporte.'],1,'Se recuerda a las hermanas Mirabal y se reclama la eliminación de la violencia contra las mujeres.'],
['🔎','Detectives de estereotipos','Desmonta ideas injustas','¿Qué frase contiene un estereotipo de género?',['Cada persona puede elegir sus aficiones.','Las niñas no deberían dirigir equipos de ciencias.','Toda la clase puede participar en robótica.'],1,'Las capacidades no dependen de ser chica o chico. Las ideas preconcebidas pueden generar discriminación.'],
['⚖️','Tribunal de los celos','¿Cuidar o controlar?','Una persona exige leer los mensajes privados de su amiga para demostrar confianza. ¿Qué ocurre?',['Es una prueba obligatoria de cariño.','Es un comportamiento de control que no respeta la privacidad.','Todas las amistades deben compartir contraseñas.'],1,'La confianza no da derecho a controlar. Cada persona tiene derecho a su privacidad y a establecer límites.'],
['💬','El chat bajo sospecha','Una conversación ficticia','Circula una foto sin permiso para burlarse de una compañera que quiere ser capitana. ¿Qué harías?',['Reenviarla para que opinen todos.','No difundirla, pedir que se retire y buscar ayuda adulta si continúa.','Participar en la burla para encajar.'],1,'No difundir mensajes dañinos y buscar apoyo ayuda a detener la burla y la discriminación.'],
['🛤️','Dos caminos','Una oportunidad justa','Vera ha construido un prototipo, pero le dicen que los chicos deberían presentarlo. ¿Qué decisión es justa?',['Vera puede presentar su trabajo y el equipo reparte las tareas según intereses.','Vera no presenta nada por ser chica.','Solo habla quien grita más.'],0,'La igualdad implica oportunidades justas y reconocimiento de las capacidades de cada persona.'],
['🔤','Laboratorio de palabras','Conectores y razones','Completa: «Vera conoce el proyecto; ______, merece presentarlo».',['sin embargo','por tanto','aunque'],1,'«Por tanto» expresa una conclusión basada en una razón. Argumentar también es parte del aprendizaje.'],
['🛡️','Guardianes de la igualdad','Actuar con respeto','Una compañera recibe burlas por elegir fútbol y te pide ayuda. ¿Qué sería adecuado?',['Escucharla, rechazar la burla y pedir apoyo cuando sea necesario.','Decirle que cambie de afición.','Mirar hacia otro lado para evitar implicarse.'],0,'Escuchar, apoyar y rechazar los prejuicios ayuda a construir un espacio seguro y respetuoso.'],
['🏆','El gran desafío','Nuestro compromiso colectivo','¿Qué compromiso de clase ayuda a prevenir la desigualdad y la violencia?',['Permitir comentarios humillantes.','Controlar las amistades de otras personas.','Rechazar estereotipos, respetar límites y pedir ayuda cuando haga falta.'],2,'La igualdad se construye con respeto, autonomía, convivencia y apoyo frente a comportamientos injustos.']
];
let s={view:'home',level:0,choice:null,done:[],points:0};
try{let v=JSON.parse(localStorage.getItem('violeta-25n-carmen-ruiz-tilve-v1')||'null');if(v&&Array.isArray(v.done))s=v}catch(e){}
const el=document.getElementById('screen');
function save(){try{localStorage.setItem('violeta-25n-carmen-ruiz-tilve-v1',JSON.stringify(s))}catch(e){}}
const btn=(t,id,alt=false)=>'<button class="btn'+(alt?' sub':'')+'" data-action="'+id+'">'+t+'</button>';
function show(){save();if(s.view==='home'){el.innerHTML='<div class="home"><section class="homecopy"><div class="tag">25 NOVIEMBRE · ODS 5</div><h1>MISIÓN<br>VIOLETA</h1><p class="lead">Ocho misiones para pensar, debatir y actuar por la igualdad. Descubre el significado del 25N y aprende a reconocer situaciones injustas.</p><p><b>6.º de Primaria · CP Carmen Ruiz-Tilve · Oviedo</b></p><div class="actions">'+btn('▶ Comenzar aventura','map')+btn('Guía docente','guide',true)+'</div><p>Sin registro, sin descargas y sin límite de tiempo.</p></section><div class="hero"><div class="ribbon">🎗️</div><div class="float a">💬 Respeto</div><div class="float b">⚖️ Igualdad</div><div class="float c">🛡️ Libertad</div></div></div>';bind();return}
if(s.view==='map'){el.innerHTML='<div class="head"><div><div class="tag">CENTRO DE MISIONES</div><h2>Elige tu desafío</h2><p>Ocho pruebas independientes · Debate y justifica tus elecciones.</p></div><div class="score">⭐ '+s.points+' puntos</div></div><div class="grid">'+data.map((x,i)=>'<button class="mission" data-action="open:'+i+'"><span class="icon">'+x[0]+'</span><small>MISIÓN '+(i+1)+'</small><b>'+x[1]+'</b><small>'+x[2]+'</small><em>'+(s.done.includes(i)?'✓ COMPLETADA':'JUGAR →')+'</em></button>').join('')+'</div><div class="bottom">'+btn('Guía docente','guide',true)+btn('Cierre del 25N','end')+'</div>';bind();return}
if(s.view==='game'||s.view==='result'){const x=data[s.level],review=s.view==='result';el.innerHTML='<div class="head"><div><div class="tag">MISIÓN '+(s.level+1)+' DE 8</div><h2>'+x[1]+'</h2><p>'+x[2]+'</p></div><div class="score">⭐ '+s.points+' puntos</div></div><div class="stagebody"><div class="illustration"><span>'+x[0]+'</span><b>🎗️ Pensamos en igualdad</b></div><section class="question"><div class="tag">LEE · RAZONA · DECIDE</div><h3>'+x[3]+'</h3><div class="options">'+x[4].map((o,i)=>'<button class="option '+(s.choice===i?'chosen ':'')+(review&&i===x[5]?'correct':'')+'" data-choice="'+i+'" '+(review?'disabled':'')+'><span>'+String.fromCharCode(65+i)+'</span>'+o+'</button>').join('')+'</div>'+(review?'<div class="feedback '+(s.choice===x[5]?'':'wrong')+'"><b>'+(s.choice===x[5]?'✓ ¡Bien razonado!':'Pensemos en otra alternativa')+'</b><p>'+x[6]+'</p></div>':'')+'<div class="bottom">'+btn('Volver al mapa','map',true)+(review?btn('Continuar →','next'):btn('Comprobar','check'))+'</div></section></div>';bind();return}
if(s.view==='guide'){el.innerHTML='<div class="tag">GUÍA PARA EL PROFESORADO</div><h2>Trabajar el 25N en 6.º</h2><div class="guide"><div><h3>Qué aprenderemos</h3><p>Significado del 25 de noviembre, igualdad de oportunidades, respeto a la privacidad, reconocimiento de estereotipos y conductas de control.</p></div><div><h3>Lengua y Valores</h3><p>Comprensión, inferencias, argumentación, conectores y lenguaje no discriminatorio. Derechos, convivencia y empatía.</p></div><div><h3>Cómo jugar</h3><p>En cinco equipos. Cada grupo propone una respuesta, explica sus razones y se debate antes de pulsar. Las misiones se pueden completar en cualquier orden.</p></div><div><h3>Protección y diversidad</h3><p>No pedir experiencias personales. Permitir respuesta oral, lectura acompañada y tiempo suficiente. Ante situaciones reales, escuchar y seguir el protocolo escolar.</p></div></div>'+btn('← Volver a las misiones','map',true);bind();return}
if(s.view==='end'){el.innerHTML='<div class="finish"><div class="medal">🏅</div><div class="tag">RETO FINAL 25N</div><h2>¡GUARDIANES DE LA IGUALDAD!</h2><p>Habéis completado <b>'+s.done.length+' de 8 misiones</b> y conseguido <b>'+s.points+' puntos</b>.</p><div class="commitment"><h3>Nuestro manifiesto violeta</h3><p>Rechazamos las burlas, los prejuicios y el control. Defendemos el respeto, la libertad y las mismas oportunidades. Cuando alguien necesite apoyo, escucharemos y pediremos ayuda a una persona adulta de confianza.</p></div><div class="actions">'+btn('Volver al mapa','map')+btn('Reiniciar juego','reset',true)+'</div></div>';bind()}}
function bind(){el.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));el.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{s.choice=+b.dataset.choice;show()})}
function act(a){if(a.startsWith('open:')){s.level=+a.split(':')[1];s.choice=null;s.view='game'}else if(a==='map'||a==='guide'||a==='end'){s.view=a}else if(a==='reset'){if(!confirm('¿Borrar el progreso de la partida?'))return;s={view:'home',level:0,choice:null,done:[],points:0}}else if(a==='check'){if(s.choice===null)return;if(s.choice===data[s.level][5]&&!s.done.includes(s.level)){s.done.push(s.level);s.points+=10}s.view='result'}else if(a==='next'){s.level++;if(s.level===data.length)s.view='end';else{s.view='game';s.choice=null}}show()}
document.getElementById('map').onclick=()=>act('map');document.getElementById('restart').onclick=()=>act('reset');show();
</script>
</body></html>
