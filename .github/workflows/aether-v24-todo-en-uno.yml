name: AETHER V24 IA DE PANTALLA EN DIRECTO + WIFI + Android ZIP
on:
  push:
    branches: [sim-turbo-build-v3-20261025]
    paths:
      - '.github/workflows/aether-v24-todo-en-uno.yml'
      - 'SIM_TURBO_BUILD/source_project_export_v24.py'
      - 'SIM_TURBO_BUILD/V24_IA_LIVE.py'
      - 'SIM_TURBO_BUILD/V24_LiveAiWifi.cs'
      - 'SIM_TURBO_BUILD/V24Patch.py'
      - 'SIM_TURBO_BUILD/CHANGELOG_V24.md'
      - 'SIM_TURBO_BUILD/V22_SettingsTest.cs'
      - 'SIM_TURBO_BUILD/V22_Settings.cs'
      - 'SIM_TURBO_BUILD/V22_AndroidBackup.java'
      - 'SIM_TURBO_BUILD/V22Patch.py'
      - 'SIM_TURBO_BUILD/source_project_export_v24.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruir proyecto completo Android V22
        run: |
          python3 SIM_TURBO_BUILD/source_project_export_v24.py
          mkdir -p stage
          unzip -q EXPORTS/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO.zip -d stage
          test -f stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/Android/app/src/main/java/com/simturbopc/ultra/AetherBackupV22.java
      - name: Configurar SDK Android
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar Android V22
        working-directory: stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER_ANDROID_V22_APK
          path: stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  paquete:
    needs: [android]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extraer fuentes AETHER V22
        shell: pwsh
        run: |
          python SIM_TURBO_BUILD/source_project_export_v24.py
          if ($LASTEXITCODE -ne 0) { throw 'No se generó el proyecto fuente V22' }
          Expand-Archive -Path 'EXPORTS/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO.zip' -DestinationPath 'stage' -Force
      - name: Compilar PC V22 con guardado real
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pc='stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/PC_Windows'
          $sources=Get-ChildItem "$pc/*.cs" | Sort-Object Name | ForEach-Object { $_.FullName }
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /out:SIM_TURBO_PC_ULTRA_V24.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Management.dll $sources
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'SIM_TURBO_PC_ULTRA_V24.exe')) { throw 'Compilación PC V22 fallida' }
      - name: Ejecutar pruebas guardado Windows
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $settingsSource=(Resolve-Path 'SIM_TURBO_BUILD/V22_Settings.cs').Path
          $settingsTest=(Resolve-Path 'SIM_TURBO_BUILD/V22_SettingsTest.cs').Path
          & $csc /nologo /target:exe /out:V22_SettingsTest.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll $settingsSource $settingsTest
          if ($LASTEXITCODE -ne 0) { throw 'Test guardado V22 no compila' }
          & './V22_SettingsTest.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Guardado y recuperación de ajustes fallaron' }
      - name: Probar que solo se enumeran modos permitidos sin modificar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $source=(Resolve-Path 'SIM_TURBO_BUILD/V23_LiveSupersampling.cs').Path
          $test=(Resolve-Path 'SIM_TURBO_BUILD/V23_LiveSupersamplingTest.cs').Path
          & $csc /nologo /target:exe /out:V23_DisplayTest.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Management.dll $source $test
          if ($LASTEXITCODE -ne 0) { throw 'Error compilando prueba V23 de pantalla' }
          & './V23_DisplayTest.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Modo de pantalla V23 no seguro' }
      - name: Probar código neuronal V24 en CI con fotogramas sintéticos
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python -m pip install --quiet opencv-contrib-python==4.11.0.86
          $ai='stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/IA_SUPERRESOLUCION'
          python "$ai/AETHER_IA_DIRECTO.py" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Red neuronal V24 no supera el test' }
          $src=(Get-Content "$ai/AETHER_IA_DIRECTO.py" -Raw)
          if ($src -match 'ChangeDisplaySettings' -or $src -match 'SetDisplayConfig') {
            throw 'IA V24 no debe modificar la resolución Windows'
          }
      - name: Empaquetar IA neuronal offline sin Python instalado
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING='utf-8'
          $env:PYTHONUTF8='1'
          python -m pip install --quiet 'opencv-contrib-python==4.11.0.86' 'pyinstaller==6.16.0' 'mss==10.2.0' 'pillow==11.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron dependencias IA' }
          $ai='stage/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO/IA_SUPERRESOLUCION'
          python "$ai/AETHER_IA_4K.py" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Falló el modelo de IA 4K' }
          python -m PyInstaller --clean --noconfirm --onefile --console --name AETHER_IA_4K --add-data "$ai/FSRCNN_x2.pb;." "$ai/AETHER_IA_4K.py"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/AETHER_IA_4K.exe')) { throw 'IA autónoma no compilada' }
          & 'dist/AETHER_IA_4K.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'IA empaquetada falla test' }
          python -m PyInstaller --clean --noconfirm --onefile --console --name AETHER_IA_DIRECTO --add-data "$ai/FSRCNN_x2.pb;." "$ai/AETHER_IA_DIRECTO.py"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/AETHER_IA_DIRECTO.exe')) { throw 'IA V24 de pantalla no se pudo empaquetar' }
          & 'dist/AETHER_IA_DIRECTO.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Fallo modelo de IA de pantalla V24' }

      - name: Crear instalador PC V22 con IA y preferencias
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iss=@'
          [Setup]
          AppId={{6D9797F5-2438-49E6-B5E7-0C26FE91B88A}
          AppName=SIM TURBO PC ULTRA
          AppVersion=24.0
          DefaultDirName={localappdata}\Programs\SIM TURBO PC ULTRA
          PrivilegesRequired=lowest
          OutputDir=release
          OutputBaseFilename=INSTALAR_AETHER_PC_V24_IA_DIRECTO_Y_WIFI
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\SIM_TURBO_PC_ULTRA_V24.exe
          [Files]
          Source: "SIM_TURBO_PC_ULTRA_V24.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "dist\AETHER_IA_4K.exe"; DestDir: "{app}\IA_SUPERRESOLUCION"; Flags: ignoreversion
          Source: "dist\AETHER_IA_DIRECTO.exe"; DestDir: "{app}\IA_SUPERRESOLUCION"; Flags: ignoreversion
          Source: "stage\SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO\IA_SUPERRESOLUCION\AETHER_IA_DIRECTO.py"; DestDir: "{app}\IA_SUPERRESOLUCION"; Flags: ignoreversion
          Source: "stage\SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO\IA_SUPERRESOLUCION\FSRCNN_x2.pb"; DestDir: "{app}\IA_SUPERRESOLUCION"; Flags: ignoreversion
          Source: "stage\SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO\IA_SUPERRESOLUCION\LICENSE_MODELO_APACHE_2.0.txt"; DestDir: "{app}\IA_SUPERRESOLUCION"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\SIM TURBO PC ULTRA"; Filename: "{app}\SIM_TURBO_PC_ULTRA_V24.exe"
          Name: "{autodesktop}\SIM TURBO PC ULTRA"; Filename: "{app}\SIM_TURBO_PC_ULTRA_V24.exe"
          '@
          Set-Content -Path 'installer-v22.iss' -Value $iss -Encoding UTF8
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $compiler)) { throw 'No se encontró Inno Setup' }
          & $compiler installer-v22.iss
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'release/INSTALAR_AETHER_PC_V24_IA_DIRECTO_Y_WIFI.exe')) { throw 'Error instalador PC' }
      - uses: actions/download-artifact@v4
        with:
          name: AETHER_ANDROID_V22_APK
          path: apk_compilada
      - name: Crear UN ZIP con PC, Android y código
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'TODO_EN_UNO/PC','TODO_EN_UNO/ANDROID','TODO_EN_UNO/PROYECTO_EDITABLE' | Out-Null
          Copy-Item 'release/INSTALAR_AETHER_PC_V24_IA_DIRECTO_Y_WIFI.exe' 'TODO_EN_UNO/PC/INSTALAR_AETHER_PC_V24_IA_DIRECTO_Y_WIFI.exe'
          $apk=Get-ChildItem 'apk_compilada' -Recurse -Filter '*.apk' | Select-Object -First 1
          if ($null -eq $apk) { throw 'APK V22 no encontrado' }
          Copy-Item $apk.FullName 'TODO_EN_UNO/ANDROID/AETHER_ANDROID_V22.apk'
          Copy-Item 'EXPORTS/SIM_TURBO_PC_ULTRA_V24_PROYECTO_COMPLETO.zip' 'TODO_EN_UNO/PROYECTO_EDITABLE/CODIGO_FUENTE_V24.zip'
          $note=@'
          SIM TURBO PC ULTRA V24 · PC Y ANDROID EN UN ZIP
          PC: Instala el EXE dentro de PC/. AETHER CLINIC > IA REAL EN DIRECTO V24 para procesar fotogramas en vivo con IA real sin cambiar resolucion de Windows. Vista previa comprobable y overlay experimental. AETHER CLINIC > GUARDADO V22 conserva las opciones. AETHER CLINIC > WI-FI V24 da un informe de gateway, ping y jitter.
          Android: instala el APK de ANDROID/. Los perfiles se guardan localmente y puedes exportarlos/importarlos.
          ATENCION: el APK Android V22 fue firmado con una clave debug NUEVA del entorno de compilacion. Puede NO instalarse sobre V20: no desinstales V20 sin saber que perderias sus perfiles anteriores. Un sistema de firma estable sera necesario para actualizaciones futuras.
          IA neuronal: PC incluye IA 4K para imágenes. No necesitas Python para usar el instalador.
          En la nube NO hay copia real todavía; el Worker Cloudflare actual no tiene base de datos autenticada.
          El guardado local persiste tras cerrar navegador, apps o reiniciar dispositivos. El procesamiento IA V24 NO usa DSR y NO cambia resolucion Windows. El filtro global es experimental, puede fallar en juegos con anti-cheat o fullscreen exclusivo, y puede bajar FPS. 1080p fisico no se vuelve 4K nativo. Encender piloto/monitor requiere consentimiento otra vez.
          PROYECTO_EDITABLE incluye Windows V24, Android V22, Cloudflare, IA de fotogramas y todo el codigo editable.
          '@
          Set-Content 'TODO_EN_UNO/LEEME_PRIMERO.txt' -Value $note -Encoding UTF8
          Compress-Archive -Path 'TODO_EN_UNO/*' -DestinationPath 'SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip' -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path 'SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip'))
          try {
            $entries=$zip.Entries | ForEach-Object { $_.FullName }
            if (-not ($entries -match 'PC/INSTALAR_AETHER_PC_V24_IA_DIRECTO_Y_WIFI.exe')) { throw 'ZIP sin PC V22' }
            if (-not ($entries -match 'ANDROID/AETHER_ANDROID_V22.apk')) { throw 'ZIP sin Android V22' }
            if (-not ($entries -match 'PROYECTO_EDITABLE/CODIGO_FUENTE_V22.zip')) { throw 'ZIP sin fuentes V22' }
          } finally { $zip.Dispose() }
          Write-Host ('UN ZIP V22 VERIFICADO: '+(Get-Item 'SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip').Length+' bytes')
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER_V24_PC_ANDROID_IA_LIVE_Y_WIFI_UN_SOLO_ZIP
          path: SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip
          if-no-files-found: error
      - name: Publicar ZIP único en rama del proyecto
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip'
          Copy-Item $file "$env:RUNNER_TEMP/AETHER_V22.zip"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for ($i=0; $i -lt 4; $i++) {
            git fetch origin sim-turbo-build-v3-20261025
            git reset --hard origin/sim-turbo-build-v3-20261025
            New-Item -ItemType Directory -Force 'RELEASES' | Out-Null
            Copy-Item "$env:RUNNER_TEMP/AETHER_V22.zip" 'RELEASES/SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip' -Force
            git add 'RELEASES/SIM_TURBO_PC_ULTRA_V24_PC_Y_ANDROID_UN_SOLO_ZIP.zip'
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git commit -m 'Entregar AETHER V24: IA de pantalla real sin cambiar resolucion, mejora Wi-Fi, Android en ZIP'
            git push origin HEAD:sim-turbo-build-v3-20261025
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'No se pudo publicar ZIP V22 por conflictos'
