name: Escudo APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'escudo-build/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Rebuild project ZIP
        run: |
          cat escudo-build/project.zip.b64.part* > /tmp/project.b64
          base64 --decode /tmp/project.b64 > /tmp/escudo.zip
          mkdir -p escudo-src
          unzip -q /tmp/escudo.zip -d escudo-src
          chmod +x escudo-src/gradlew

      - name: Build APK
        working-directory: escudo-src
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f escudo-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh escudo-src/app/build/outputs/apk/debug/app-debug.apk
          sha256sum escudo-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EscudoSentinel-v5.0.1-APK
          path: escudo-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
