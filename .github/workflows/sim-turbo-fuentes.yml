name: Publicar proyecto fuente completo editable
on:
  push:
    branches: [sim-turbo-build-v3-20261025]
    paths:
      - '.github/workflows/sim-turbo-fuentes.yml'
      - '.github/workflows/sim-turbo-compilar.yml'
      - 'SIM_TURBO_BUILD/*.py'
      - 'SIM_TURBO_BUILD/*.cs'
      - 'SIM_TURBO_BUILD/*.java'
      - 'SIM_TURBO_BUILD/*.md'
      - 'SIM_TURBO_BUILD/*.b64'
      - 'AETHER_CLOUDFLARE/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir Windows V21, Android V20, Cloudflare e IA 4K desde codigo fuente
        run: python3 SIM_TURBO_BUILD/source_project_export.py
      - name: Comprobar integridad del ZIP y archivos editables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('EXPORTS/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip')
          assert p.is_file()
          with ZipFile(p) as z:
              assert z.testzip() is None
              paths=z.namelist()
              required=[
                'PC_Windows/SIM_TURBO_PC_ULTRA.sln',
                'PC_Windows/SIM_TURBO_PC_ULTRA.csproj',
                'PC_Windows/V12_SuperResolution.cs',
                'PC_Windows/V13_NetworkLab.cs',
                'PC_Windows/V14_LinkAudit.cs',
                'PC_Windows/V15_PerformanceProfiler.cs',
                'PC_Windows/V16_ExperimentLab.cs',
                'PC_Windows/V17_GraphicsAdvisor.cs',
                'PC_Windows/V17_SecurePacket.cs',
                'PC_Windows/V18_StorageClinic.cs',
                'PC_Windows/V19_GameProcessClinic.cs',
                'Android/app/src/main/java/com/simturbopc/ultra/MonitorCadenceV18.java',
                'Android/app/src/main/java/com/simturbopc/ultra/GameAutoProfileV19.java',
                'Android/app/src/main/java/com/simturbopc/ultra/NetworkQuality.java',
                'Android/app/src/main/java/com/simturbopc/ultra/ControllerLayoutsV14.java',
                'Android/app/src/main/java/com/simturbopc/ultra/TouchJoystickV15.java',
                'Android/app/src/main/java/com/simturbopc/ultra/PcRoundtripV15.java',
                'Android/app/src/main/java/com/simturbopc/ultra/DeviceAdvisorV16.java',
                'Android/app/src/main/java/com/simturbopc/ultra/SecurePacketV17.java',
                'Android/app/src/main/java/com/simturbopc/ultra/BondedServer.java',
                'Cloudflare/aether-worker.js',
                'PC_Windows/V12_LanDiscovery.cs',
                'Android/app/src/main/java/com/simturbopc/ultra/AetherMonitorService.java',
                'Android/app/src/main/java/com/simturbopc/ultra/GameProfiles.java',
                'Android/app/src/main/java/com/simturbopc/ultra/PcDiscovery.java',
                'CHANGELOG_V13.md',
                'CHANGELOG_V14.md',
                'CHANGELOG_V15.md',
                'CHANGELOG_V16.md',
                'CHANGELOG_V17.md',
                'CHANGELOG_V18.md',
                'CHANGELOG_V19.md',
                'SHA256SUMS.txt',
                'compilar_windows.ps1',
                'LEEME.txt'
              ]
              for suffix in required:
                  assert any(f.endswith(suffix) for f in paths),suffix
              assert not any(f.endswith(('.exe','.apk')) for f in paths)
              root='SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO/'
              manifest=z.read(root+'SHA256SUMS.txt').decode('utf-8')
              checked=0
              for line in manifest.splitlines():
                  expected,rel=line.split('  ',1)
                  actual=hashlib.sha256(z.read(root+rel)).hexdigest()
                  assert actual==expected,rel
                  checked+=1
              assert checked>=40,checked
              assert 'connectedDevice' in z.read(root+'Android/app/src/main/AndroidManifest.xml').decode()
              assert 'HighQualityBicubic' in z.read(root+'PC_Windows/V12_SuperResolution.cs').decode()
              assert 'bytesPerSample=5*1024*1024' in z.read(root+'PC_Windows/V13_NetworkLab.cs').decode()
              assert 'getLinkDownstreamBandwidthKbps' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/NetworkQuality.java').decode()
              assert 'BuildReport' in z.read(root+'PC_Windows/V14_LinkAudit.cs').decode()
              assert 'MINECRAFT' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/ControllerLayoutsV14.java').decode()
              assert 'Sample Collect()' in z.read(root+'PC_Windows/V15_PerformanceProfiler.cs').decode()
              assert 'Median(double[] v)' in z.read(root+'PC_Windows/V16_ExperimentLab.cs').decode()
              assert 'GameProfiles.recommendation' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/DeviceAdvisorV16.java').decode()
              assert 'ACTION_CANCEL' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/TouchJoystickV15.java').decode()
              assert 'PcDiscovery.capabilities' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/PcRoundtripV15.java').decode()
              assert 'HMACSHA256' in z.read(root+'PC_Windows/V17_SecurePacket.cs').decode()
              assert 'HmacSHA256' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/SecurePacketV17.java').decode()
              assert 'AetherSecurePacketV17.TryParseController' in z.read(root+'PC_Windows/V11_AndroidGamepad.cs').decode()
              assert 'SecurePacketV17.encode' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/ControllerSender.java').decode()
              assert 'AetherGraphicsAdvisorV17' in z.read(root+'PC_Windows/V17_GraphicsAdvisor.cs').decode()
              assert 'SpaceAdvice' in z.read(root+'PC_Windows/V18_StorageClinic.cs').decode()
              assert 'MonitorCadenceV18.intervalMs' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/AetherMonitorService.java').decode()
              assert 'intervalMs' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/MonitorCadenceV18.java').decode()
              assert 'AetherGameProcessClinicV19' in z.read(root+'PC_Windows/V19_GameProcessClinic.cs').decode()
              assert 'GameLayoutOverridesV20.resolve' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/MainActivity.java').decode()
              assert 'GameAutoProfileV19' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/GameAutoProfileV19.java').decode()
              # FSRCNN weights must be truly embedded and the editable GUI included.
              assert len(z.read(root+'IA_SUPERRESOLUCION/FSRCNN_x2.pb'))==38973
              assert 'engine.upsample' in z.read(root+'IA_SUPERRESOLUCION/AETHER_IA_4K.py').decode()
              assert 'AetherAi4KV21' in z.read(root+'PC_Windows/V21_AiSuperResolution.cs').decode()
              assert 'AetherNetworkStabilityV20' in z.read(root+'PC_Windows/V20_NetworkStability.cs').decode()
              print('Hashes de fuentes verificados:',checked)
          print('Proyecto fuente validado; archivos:',len(paths),'bytes:',p.stat().st_size)
          PY
      - name: Ejecutar IA neuronal REAL FSRCNN x2 sobre imagen sintética
        run: |
          python3 -m pip install --quiet opencv-contrib-python-headless==4.11.0.86
          mkdir -p /tmp/aether-v21-neural
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('EXPORTS/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip') as z:
              for name in ('AETHER_IA_4K.py','FSRCNN_x2.pb'):
                  member=next(n for n in z.namelist() if n.endswith('/IA_SUPERRESOLUCION/'+name))
                  (Path('/tmp/aether-v21-neural')/name).write_bytes(z.read(member))
          PY
          python3 /tmp/aether-v21-neural/AETHER_IA_4K.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          import cv2,numpy as np,subprocess,sys
          tmp=Path('/tmp/aether-v21-neural')
          h,w=1080,1920
          yy,xx=np.mgrid[:h,:w]
          im=np.zeros((h,w,3),dtype=np.uint8)
          im[:,:,0]=(xx%256).astype(np.uint8)
          im[:,:,1]=(yy%256).astype(np.uint8)
          im[:,:,2]=(((xx//28+yy//28)%2)*255).astype(np.uint8)
          src=tmp/'sample_FHD.png'
          dst=tmp/'sample_IA_4K.png'
          assert cv2.imwrite(str(src),im)
          subprocess.run([sys.executable,str(tmp/'AETHER_IA_4K.py'),
              '--input',str(src),'--output',str(dst),'--tile','192'],check=True,timeout=480)
          result=cv2.imread(str(dst))
          assert result is not None
          assert result.shape == (2160,3840,3),result.shape
          print('IA REAL CONVERSION FHD→UHD 1920x1080 -> 3840x2160 VALIDADA')
          print('Bytes PNG:',dst.stat().st_size)
          PY

      - name: Registrar hash SHA256 del ZIP V21
        run: sha256sum EXPORTS/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO_FUENTES
          path: EXPORTS/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip
          if-no-files-found: error
      - name: Publicar ZIP sin pisar cambios nuevos de otras ejecuciones
        shell: bash
        run: |
          set -euo pipefail
          branch=sim-turbo-build-v3-20261025
          archive=EXPORTS/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip
          cp "$archive" /tmp/aether-v21-sources.zip
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            # Never publish a stale ZIP after another run changed the source files.
            changed="$(git diff --name-only "$GITHUB_SHA" "origin/$branch" -- SIM_TURBO_BUILD AETHER_CLOUDFLARE .github/workflows/sim-turbo-fuentes.yml .github/workflows/sim-turbo-compilar.yml)"
            if printf '%s\n' "$changed" | grep -Eq '^(SIM_TURBO_BUILD/.*\.(py|cs|java|md|b64)|AETHER_CLOUDFLARE/|\.github/workflows/sim-turbo-fuentes\.yml|\.github/workflows/sim-turbo-compilar\.yml)'; then
              echo "Newer source changes detected; do not publish a stale ZIP."
              exit 0
            fi
            git reset --hard "origin/$branch"
            cp /tmp/aether-v21-sources.zip "$archive"
            git add "$archive"
            if git diff --cached --quiet; then
              echo "Same archive already published."
              exit 0
            fi
            git commit -m "Publicar ZIP editable AETHER V21 con pesos IA neuronales"
            if git push origin "HEAD:$branch"; then
              echo "Published source ZIP."
              exit 0
            fi
            echo "Concurrent update; retry $attempt"
          done
          exit 1

# V13 reproducible source bundle: latest sources after compiler workflow changes.


  validar_windows_v21:
    name: Compilar Windows con IA 4K V21
    needs: fuentes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO_FUENTES
          path: descargas
      - name: Extraer proyecto fuente y compilar aplicación C# con la pestaña IA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path 'descargas/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO.zip' -DestinationPath 'extraido' -Force
          $proyecto=Join-Path $pwd 'extraido/SIM_TURBO_PC_ULTRA_V21_PROYECTO_COMPLETO'
          $sources=Get-ChildItem (Join-Path $proyecto 'PC_Windows/*.cs') | ForEach-Object { $_.FullName }
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /out:SIM_TURBO_PC_ULTRA_V21_TEST.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Management.dll $sources
          if ($LASTEXITCODE -ne 0) { throw 'Error compilando C# V21' }
          if (!(Test-Path 'SIM_TURBO_PC_ULTRA_V21_TEST.exe')) { throw 'No existe el exe de prueba' }
          Write-Host ('Windows V21 compilado correctamente: ' + (Get-Item 'SIM_TURBO_PC_ULTRA_V21_TEST.exe').Length + ' bytes')
          if (!(Test-Path (Join-Path $proyecto 'IA_SUPERRESOLUCION/FSRCNN_x2.pb'))) { throw 'Modelo IA no incluido' }
          if (!(Test-Path (Join-Path $proyecto 'IA_SUPERRESOLUCION/AETHER_IA_4K.py'))) { throw 'Código IA no incluido' }
