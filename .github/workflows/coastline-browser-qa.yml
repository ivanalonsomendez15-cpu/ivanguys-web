name: COASTLINE GT browser WebGL audit
on:
  push:
    branches:
      - coastline-gt-oviedo-todas-calles-geometria-real
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture original WebGL build and city mode
        run: node tools/coastline-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastline-browser-authentic-screenshots
          path: artifacts/

      - name: Archive exact complete HTML and ZIP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastline-qa-complete-html-zip
          path: |
            COASTLINE_GT_OVIEDO_EDIFICIOS_OFICIALES_QA.html
            COASTLINE_GT_OVIEDO_EDIFICIOS_OFICIALES_QA.zip
