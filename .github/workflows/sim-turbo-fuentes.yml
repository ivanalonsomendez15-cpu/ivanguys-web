name: Publicar proyecto fuente completo editable
on:
  push:
    branches: [sim-turbo-build-v3-20261025]
    paths:
      - '.github/workflows/sim-turbo-fuentes.yml'
      - 'SIM_TURBO_BUILD/*.py'
      - 'SIM_TURBO_BUILD/*.cs'
      - 'SIM_TURBO_BUILD/*.java'
      - 'SIM_TURBO_BUILD/*.md'
      - 'SIM_TURBO_BUILD/*.b64'
      - 'AETHER_CLOUDFLARE/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir Windows V15, Android V15 y Cloudflare desde codigo fuente
        run: python3 SIM_TURBO_BUILD/source_project_export.py
      - name: Comprobar integridad del ZIP y archivos editables
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('EXPORTS/SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO.zip')
          assert p.is_file()
          with ZipFile(p) as z:
              assert z.testzip() is None
              paths=z.namelist()
              required=[
                'PC_Windows/SIM_TURBO_PC_ULTRA.sln',
                'PC_Windows/SIM_TURBO_PC_ULTRA.csproj',
                'PC_Windows/V12_SuperResolution.cs',
                'PC_Windows/V13_NetworkLab.cs',
                'PC_Windows/V14_LinkAudit.cs',
                'PC_Windows/V15_PerformanceProfiler.cs',
                'Android/app/src/main/java/com/simturbopc/ultra/NetworkQuality.java',
                'Android/app/src/main/java/com/simturbopc/ultra/ControllerLayoutsV14.java',
                'Android/app/src/main/java/com/simturbopc/ultra/TouchJoystickV15.java',
                'Android/app/src/main/java/com/simturbopc/ultra/PcRoundtripV15.java',
                'Android/app/src/main/java/com/simturbopc/ultra/BondedServer.java',
                'Cloudflare/aether-worker.js',
                'PC_Windows/V12_LanDiscovery.cs',
                'Android/app/src/main/java/com/simturbopc/ultra/AetherMonitorService.java',
                'Android/app/src/main/java/com/simturbopc/ultra/GameProfiles.java',
                'Android/app/src/main/java/com/simturbopc/ultra/PcDiscovery.java',
                'CHANGELOG_V13.md',
                'CHANGELOG_V14.md',
                'CHANGELOG_V15.md',
                'SHA256SUMS.txt',
                'compilar_windows.ps1',
                'LEEME.txt'
              ]
              for suffix in required:
                  assert any(f.endswith(suffix) for f in paths),suffix
              assert not any(f.endswith(('.exe','.apk')) for f in paths)
              root='SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO/'
              manifest=z.read(root+'SHA256SUMS.txt').decode('utf-8')
              checked=0
              for line in manifest.splitlines():
                  expected,rel=line.split('  ',1)
                  actual=hashlib.sha256(z.read(root+rel)).hexdigest()
                  assert actual==expected,rel
                  checked+=1
              assert checked>=40,checked
              assert 'connectedDevice' in z.read(root+'Android/app/src/main/AndroidManifest.xml').decode()
              assert 'HighQualityBicubic' in z.read(root+'PC_Windows/V12_SuperResolution.cs').decode()
              assert 'bytesPerSample=5*1024*1024' in z.read(root+'PC_Windows/V13_NetworkLab.cs').decode()
              assert 'getLinkDownstreamBandwidthKbps' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/NetworkQuality.java').decode()
              assert 'BuildReport' in z.read(root+'PC_Windows/V14_LinkAudit.cs').decode()
              assert 'MINECRAFT' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/ControllerLayoutsV14.java').decode()
              assert 'Sample Collect()' in z.read(root+'PC_Windows/V15_PerformanceProfiler.cs').decode()
              assert 'ACTION_CANCEL' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/TouchJoystickV15.java').decode()
              assert 'PcDiscovery.capabilities' in z.read(root+'Android/app/src/main/java/com/simturbopc/ultra/PcRoundtripV15.java').decode()
              print('Hashes de fuentes verificados:',checked)
          print('Proyecto fuente validado; archivos:',len(paths),'bytes:',p.stat().st_size)
          PY
      - name: Registrar hash SHA256 del ZIP V15
        run: sha256sum EXPORTS/SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO_FUENTES
          path: EXPORTS/SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO.zip
          if-no-files-found: error
      - name: Publicar ZIP sin pisar cambios nuevos de otras ejecuciones
        shell: bash
        run: |
          set -euo pipefail
          branch=sim-turbo-build-v3-20261025
          archive=EXPORTS/SIM_TURBO_PC_ULTRA_V15_PROYECTO_COMPLETO.zip
          cp "$archive" /tmp/aether-v15-sources.zip
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            # Never publish a stale ZIP after another run changed the source files.
            changed="$(git diff --name-only "$GITHUB_SHA" "origin/$branch" -- SIM_TURBO_BUILD AETHER_CLOUDFLARE .github/workflows/sim-turbo-fuentes.yml)"
            if printf '%s\n' "$changed" | grep -Eq '^(SIM_TURBO_BUILD/.*\.(py|cs|java|md|b64)|AETHER_CLOUDFLARE/|\.github/workflows/sim-turbo-fuentes\.yml)'; then
              echo "Newer source changes detected; do not publish a stale ZIP."
              exit 0
            fi
            git reset --hard "origin/$branch"
            cp /tmp/aether-v15-sources.zip "$archive"
            git add "$archive"
            if git diff --cached --quiet; then
              echo "Same archive already published."
              exit 0
            fi
            git commit -m "Publicar ZIP editable AETHER V15 con hashes"
            if git push origin "HEAD:$branch"; then
              echo "Published source ZIP."
              exit 0
            fi
            echo "Concurrent update; retry $attempt"
          done
          exit 1

# V13 reproducible source bundle: latest sources after compiler workflow changes.
