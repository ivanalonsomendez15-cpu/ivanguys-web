name: SIM TURBO PC ULTRA - Compilar instaladores
on:
  push:
    branches: [sim-turbo-build-v3-20261025]
    paths:
      - 'SIM_TURBO_BUILD/*.py'
      - 'SIM_TURBO_BUILD/*.cs'
      - 'SIM_TURBO_BUILD/*.java'
      - 'SIM_TURBO_BUILD/*.md'
      - 'SIM_TURBO_BUILD/*.b64'
      - '.github/workflows/sim-turbo-compilar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Android
        run: base64 -d SIM_TURBO_BUILD/Android_source.tar.xz.b64 | tar -xJf -
      - name: Integrar motor Android V4
        run: python3 SIM_TURBO_BUILD/V4Patch.py
      - name: Integrar mando Android V11 sin quitar puente SIM V4
        run: python3 SIM_TURBO_BUILD/V11Patch.py
      - name: Integrar monitor Android V12 y perfiles por juego
        run: python3 SIM_TURBO_BUILD/V12Patch.py
      - name: Integrar informe de red Android V13
        run: python3 SIM_TURBO_BUILD/V13Patch.py
      - name: Integrar perfiles de mando Android V14
        run: python3 SIM_TURBO_BUILD/V14Patch.py
      - name: Integrar joystick táctil y prueba LAN Android V15
        run: python3 SIM_TURBO_BUILD/V15Patch.py
      - name: Integrar asesor de móvil y juego V16
        run: python3 SIM_TURBO_BUILD/V16Patch.py
      - name: Integrar autenticación LAN y mando Android V17
        run: python3 SIM_TURBO_BUILD/V17Patch.py
      - name: Integrar monitor Android de batería V18
        run: python3 SIM_TURBO_BUILD/V18Patch.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar HMAC Android V17 con vectores cruzados
        shell: bash
        run: |
          mkdir -p protocol_test/src/com/simturbopc/ultra protocol_test/classes
          cp SIM_TURBO_BUILD/V17_SecurePacket.java protocol_test/src/com/simturbopc/ultra/SecurePacketV17.java
          cp SIM_TURBO_BUILD/V17_ProtocolTest.java protocol_test/src/com/simturbopc/ultra/ProtocolTestV17.java
          javac -d protocol_test/classes protocol_test/src/com/simturbopc/ultra/*.java
          java -cp protocol_test/classes com.simturbopc.ultra.ProtocolTestV17
      - name: Probar cadencia de monitor Android V18
        shell: bash
        run: |
          mkdir -p cadence_test/src/com/simturbopc/ultra cadence_test/classes
          cp SIM_TURBO_BUILD/V18_MonitorCadence.java cadence_test/src/com/simturbopc/ultra/MonitorCadenceV18.java
          cp SIM_TURBO_BUILD/V18_MonitorCadenceTest.java cadence_test/src/com/simturbopc/ultra/MonitorCadenceTestV18.java
          javac -d cadence_test/classes cadence_test/src/com/simturbopc/ultra/*.java
          java -cp cadence_test/classes com.simturbopc.ultra.MonitorCadenceTestV18
      - name: Usar SDK Android del entorno
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de desarrollo
        working-directory: Android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Windows
        shell: pwsh
        run: |
          $data=[Convert]::FromBase64String((Get-Content -Raw 'SIM_TURBO_BUILD/Windows_source.tar.xz.b64').Trim())
          [IO.File]::WriteAllBytes((Join-Path $pwd 'Windows_source.tar.xz'), $data)
          tar -xf Windows_source.tar.xz
      - name: Corregir capas WinForms y compatibilidad TLS
        shell: pwsh
        run: |
          $path='PC_Windows/SIM_TURBO_PC.cs'
          $cs=[IO.File]::ReadAllText((Join-Path $pwd $path))
          $anchor='            Append("No se necesitan permisos de administrador. No se comparte la SIM.");'
          if(-not $cs.Contains($anchor)) { throw 'No se encontró ancla UI' }
          $fixed=$anchor + [Environment]::NewLine + '            foreach (Panel card in Controls.OfType<Panel>()) card.SendToBack();'
          $cs=$cs.Replace($anchor,$fixed)
          $tlsAnchor='string url="https://speed.cloudflare.com/'
          if(-not $cs.Contains($tlsAnchor)) { throw 'No se encontró punto TLS' }
          $cs=$cs.Replace($tlsAnchor,'ServicePointManager.SecurityProtocol |= SecurityProtocolType.Tls12;' + [Environment]::NewLine + '                ' + $tlsAnchor)
          $cs=$cs.Replace('ULTRA   V3.0','ULTRA   V3.2')
          [IO.File]::WriteAllText((Join-Path $pwd $path),$cs,[Text.UTF8Encoding]::new($true))
      - name: Integrar motor Windows V4
        shell: pwsh
        run: python SIM_TURBO_BUILD/V4Patch.py
      - name: Integrar centro gaming FPS + drivers V5
        shell: pwsh
        run: python SIM_TURBO_BUILD/V5Patch.py
      - name: Integrar Autopiloto FPS y telemetria de red V6
        shell: pwsh
        run: python SIM_TURBO_BUILD/V6Patch.py
      - name: Integrar PulseRoute V7 Wi-Fi Ethernet TCP
        shell: pwsh
        run: python SIM_TURBO_BUILD/V7Patch.py
      - name: Integrar AETHER-LINK V8 descarga adaptativa y piloto global
        shell: pwsh
        run: python SIM_TURBO_BUILD/V8Patch.py
      - name: Integrar laboratorio de 80 modulos AETHER V9
        shell: pwsh
        run: python SIM_TURBO_BUILD/V9Patch.py
      - name: Integrar AETHER Innovation y DNS Guard V10
        shell: pwsh
        run: python SIM_TURBO_BUILD/V10Patch.py
      - name: Integrar System Clinic V11 y receptor seguro de mando Android
        shell: pwsh
        run: python SIM_TURBO_BUILD/V11Patch.py
      - name: Integrar superresolucion y descubrimiento LAN V12
        shell: pwsh
        run: python SIM_TURBO_BUILD/V12Patch.py
      - name: Integrar laboratorio de red Windows V13
        shell: pwsh
        run: python SIM_TURBO_BUILD/V13Patch.py
      - name: Integrar auditoría de enlaces Windows V14
        shell: pwsh
        run: python SIM_TURBO_BUILD/V14Patch.py
      - name: Integrar perfilador de rendimiento Windows V15
        shell: pwsh
        run: python SIM_TURBO_BUILD/V15Patch.py
      - name: Integrar comparador A/B Windows V16
        shell: pwsh
        run: python SIM_TURBO_BUILD/V16Patch.py
      - name: Integrar asesor gráfico y HMAC Windows V17
        shell: pwsh
        run: python SIM_TURBO_BUILD/V17Patch.py
      - name: Integrar clínica Windows de disco e inicio V18
        shell: pwsh
        run: python SIM_TURBO_BUILD/V18Patch.py
      - name: Probar reglas de almacenamiento V18
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:V18_StorageClinicTest.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll SIM_TURBO_BUILD\V18_StorageClinic.cs SIM_TURBO_BUILD\V18_StorageClinicTest.cs
          if($LASTEXITCODE -ne 0) { throw 'Error compilando pruebas V18' }
          & .\V18_StorageClinicTest.exe
          if($LASTEXITCODE -ne 0) { throw 'Fallaron reglas de almacenamiento V18' }
      - name: Probar HMAC Windows V17 con vectores cruzados
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:V17_ProtocolTest.exe SIM_TURBO_BUILD\V17_SecurePacket.cs SIM_TURBO_BUILD\V17_ProtocolTest.cs
          if($LASTEXITCODE -ne 0) { throw 'Error compilando prueba C#' }
          & .\V17_ProtocolTest.exe
          if($LASTEXITCODE -ne 0) { throw 'Falló prueba de autenticación LAN V17' }
      - name: Compilar ejecutable real
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /target:winexe /out:SIM_TURBO_PC_ULTRA_V18.exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Management.dll PC_Windows\SIM_TURBO_PC.cs PC_Windows\V4_BondedDownloader.cs PC_Windows\V5_PerformanceCenter.cs PC_Windows\V6_HyperAdaptive.cs PC_Windows\V7_PulseRoute.cs PC_Windows\V8_AetherDownloader.cs PC_Windows\V8_AetherAutopilot.cs PC_Windows\V9_Aether80Lab.cs PC_Windows\V9_Radar.cs PC_Windows\V9_ResearchLab.cs PC_Windows\V10_InnovationLab.cs PC_Windows\V10_IdeaEngine.cs PC_Windows\V11_SystemClinic.cs PC_Windows\V11_AndroidGamepad.cs PC_Windows\V12_LanDiscovery.cs PC_Windows\V12_SuperResolution.cs PC_Windows\V13_NetworkLab.cs PC_Windows\V14_LinkAudit.cs PC_Windows\V15_PerformanceProfiler.cs PC_Windows\V16_ExperimentLab.cs PC_Windows\V17_SecurePacket.cs PC_Windows\V17_GraphicsAdvisor.cs PC_Windows\V18_StorageClinic.cs
          if($LASTEXITCODE -ne 0) { throw 'Error compilando C#' }
      - name: Crear instalador Inno Setup
        shell: pwsh
        run: |
          $iss=@'
          [Setup]
          AppId={{6D9797F5-2438-49E6-B5E7-0C26FE91B88A}
          AppName=SIM TURBO PC ULTRA
          AppVersion=18.0
          DefaultDirName={localappdata}\Programs\SIM TURBO PC ULTRA
          PrivilegesRequired=lowest
          OutputDir=release
          OutputBaseFilename=SIM_TURBO_PC_ULTRA_V18_SETUP
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\SIM_TURBO_PC_ULTRA_V18.exe
          [Files]
          Source: "SIM_TURBO_PC_ULTRA_V18.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\SIM TURBO PC ULTRA"; Filename: "{app}\SIM_TURBO_PC_ULTRA_V18.exe"
          Name: "{autodesktop}\SIM TURBO PC ULTRA"; Filename: "{app}\SIM_TURBO_PC_ULTRA_V18.exe"; Tasks: desktopicon
          [Tasks]
          Name: desktopicon; Description: "Crear acceso directo en el escritorio"; GroupDescription: "Accesos directos:"; Flags: unchecked
          [Run]
          Filename: "{app}\SIM_TURBO_PC_ULTRA_V18.exe"; Description: "Abrir SIM TURBO PC ULTRA"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path 'installer.iss' -Value $iss -Encoding UTF8
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          if(!(Test-Path $compiler)) { throw 'No se pudo instalar Inno Setup' }
          & $compiler installer.iss
          if($LASTEXITCODE -ne 0) { throw 'Error generando instalador' }
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            release/SIM_TURBO_PC_ULTRA_V18_SETUP.exe
            SIM_TURBO_PC_ULTRA_V18.exe
          if-no-files-found: error
  publicar:
    runs-on: ubuntu-latest
    needs: [android, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: resultados/apk
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: resultados/exe
      - name: Publicar compilaciones V18 sin conflictos concurrentes
        shell: bash
        run: |
          set -euo pipefail
          branch=sim-turbo-build-v3-20261025
          cp resultados/apk/app-debug.apk /tmp/AETHER_V18.apk
          cp resultados/exe/release/SIM_TURBO_PC_ULTRA_V18_SETUP.exe /tmp/AETHER_V18_SETUP.exe
          cp resultados/exe/SIM_TURBO_PC_ULTRA_V18.exe /tmp/AETHER_V18_PORTABLE.exe
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            changed="$(git diff --name-only "$GITHUB_SHA" "origin/$branch" -- SIM_TURBO_BUILD AETHER_CLOUDFLARE)"
            if printf '%s\n' "$changed" | grep -Eq '^(SIM_TURBO_BUILD/.*\.(py|cs|java|md|b64)|AETHER_CLOUDFLARE/)'; then
              echo "Fuentes posteriores detectadas; no publicar binarios obsoletos."
              exit 0
            fi
            git reset --hard "origin/$branch"
            cp /tmp/AETHER_V18.apk SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18.apk
            cp /tmp/AETHER_V18_SETUP.exe SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18_SETUP.exe
            cp /tmp/AETHER_V18_PORTABLE.exe SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18_PORTABLE.exe
            git add SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18.apk SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18_SETUP.exe SIM_TURBO_BUILD/SIM_TURBO_PC_ULTRA_V18_PORTABLE.exe
            if git diff --cached --quiet; then
              echo "Binarios ya publicados con el mismo contenido."
              exit 0
            fi
            git commit -m 'Publicar compilaciones AETHER V18 Windows y Android'
            if git push origin "HEAD:$branch"; then
              echo "Binarios V18 publicados."
              exit 0
            fi
            echo "Actualización simultánea; reintentando $attempt"
          done
          exit 1
