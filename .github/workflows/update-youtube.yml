
name: Sincronizar YouTube IVANGUYS

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write

jobs:
  actualizar-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sincronizar mi canal
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/sync_youtube.py

      - name: Guardar estadísticas y vídeos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar YouTube IVANGUYS"
            git push
          fi
