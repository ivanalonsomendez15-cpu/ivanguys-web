<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría 3D V16.4</title><style>body{font:15px system-ui;background:#102439;color:#eee;margin:12px}pre{white-space:pre-wrap}iframe{border:1px solid #6790a5;width:min(844px,100%);height:390px;display:block}</style><h1>Prueba de ejecución 3D V16.4</h1><p>El propio juego se ejecuta en este marco. La prueba no activa balizas ni modifica trabajos escolares.</p><pre id="result">Iniciando…</pre><iframe id="gameframe" src="v16-auditoria.html?v=16.4" title="Juego real de Generación Cambio"></iframe><script>
(async()=>{const o=document.getElementById('result'),f=document.getElementById('gameframe'),results={};const delay=ms=>new Promise(r=>setTimeout(r,ms));const show=s=>o.textContent=s+'\n'+JSON.stringify(results,null,2);
const until=async(fn,ms)=>{const end=Date.now()+ms;while(Date.now()<end){try{if(fn())return true}catch{}await delay(100)}return false};
try{if(!await until(()=>f.contentWindow.GC_3D_Diagnostics?.snapshot().ready,25000)){results.ready=false;results.message='No fue posible obtener un primer fotograma WebGL en este entorno.';show('AUDITORÍA TERMINADA');return}
const w=f.contentWindow,d=f.contentDocument,diag=()=>w.GC_3D_Diagnostics.snapshot();results.ready=true;results.initial=diag();d.getElementById('start').click();await delay(350);results.started=diag().playing;
const key=(code,down)=>w.dispatchEvent(new w.KeyboardEvent(down?'keydown':'keyup',{code,bubbles:true,cancelable:true}));
const pos=()=>diag().position;const moved=(a,b)=>Math.hypot(a[0]-b[0],a[2]-b[2]);
let a=pos();key('KeyW',true);await delay(850);key('KeyW',false);let b=pos();results.forwardDistance=moved(a,b);results.forwardPassed=b[2]<a[2]-.03;
a=pos();key('KeyD',true);await delay(650);key('KeyD',false);b=pos();results.rightPassed=b[0]>a[0]+.03;results.rightDistance=moved(a,b);
let baseline=pos()[1],top=baseline;key('Space',true);for(let i=0;i<12;i++){await delay(80);top=Math.max(top,pos()[1])}key('Space',false);results.jumpHeight=top-baseline;results.jumpPassed=top>baseline+.04;
const canvas=d.querySelector('#viewport canvas'),distance=diag().distance;canvas.dispatchEvent(new w.WheelEvent('wheel',{deltaY:200,bubbles:true,cancelable:true}));results.zoomPassed=diag().distance>distance;d.getElementById('resetCam').click();results.resetCameraPassed=Math.abs(diag().distance-10)<.01;
const left=d.querySelector('#dpad [data-key="KeyA"]');a=pos();left.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:8,bubbles:true,cancelable:true}));await delay(650);left.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:8,bubbles:true}));b=pos();results.touchLeftPassed=b[0]<a[0]-.03;
let portalCount=0;for(let i=0;i<6;i++){d.querySelector('#worlds [data-world="'+i+'"]').click();if(d.getElementById('modal').classList.contains('show'))portalCount++;d.getElementById('close').click()}results.portalsOpened=portalCount;
w.GC_Phase2.openArea('oceano');await delay(100);const before=diag().frames;await delay(500);results.renderPaused=diag().frames===before;results.researchCards=d.querySelectorAll('.r15-card').length;w.GC_Phase2.close();await delay(400);results.renderResumed=diag().frames>before;
const first=diag().frames,begin=performance.now();await delay(3000);const last=diag();results.fpsObserved=(last.frames-first)*1000/(performance.now()-begin);results.final=last;results.note='Eventos sintetizados sobre el motor WebGL real; no prueba captura manual ni rendimiento de hardware escolar.';show('AUDITORÍA TERMINADA');
}catch(e){results.error=String(e);show('AUDITORÍA TERMINADA')}})();
</script></html>
