<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta content="IE=edge" http-equiv="X-UA-Compatible"><meta content="width=device-width,initial-scale=1" name="viewport"><link href="//fonts.googleapis.com/css?family=Lobster|Fugaz+One|Google+Sans:400,500,700" rel="stylesheet"><style>body{margin:0;background:#fff;color:#333;font-family:"Lobster";display:flex;align-items:center;justify-content:center;flex-flow:column;min-height:100vh;background:transparent center}canvas{-ms-interpolation-mode:nearest-neighbor;image-rendering:-webkit-optimize-contrast;image-rendering:-moz-crisp-edges;image-rendering:pixelated}#holder{position:relative}#games{display:flex;position:absolute;top:50%;left:0;right:0;justify-content:center;align-items:flex-start;flex-flow:row wrap}#games a{width:1em;height:1em;margin:0 .25em .5em;display:flex;justify-content:flex-end;align-items:center;flex-flow:column;filter:drop-shadow(2px 4px rgba(0, 0, 0, 0.25))}canvas#retroSurface{filter:drop-shadow(8px 16px 0 rgba(0, 0, 0, 0.25))}</style><style id="extraStyles"></style></head><body><canvas id="titleSurface"></canvas><div id="holder"><canvas id="retroSurface"></canvas><div id="games"></div></div><canvas id="noticeSurface"></canvas><script>
(function() {
  var fallback = (location.search || '').match(/\bfallback=1\b/);
  var all = [true].map(function(i18n, i) {
    return (fallback ? 'fallback-' : '') + i + (i18n ? '_' + document.documentElement.lang : '') + '.js';
  });
  fallback && all.unshift("../../support.js");
  (function next() {
    var src = all.shift();
    if (src) {
      var node = document.createElement('script');
      node.src = src;
      if (fallback) {
        node.onload = node.onerror = next;
      } else {
        node.setAttribute('type', 'module');
        next();
      }
      document.head.appendChild(node);
    }
  })();
})();</script></body></html>
